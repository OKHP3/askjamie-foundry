name: Technology version check

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "manifest.json"
      - "declarativeagent_0.json"
      - ".replit"
      - "technology-inventory.json"
      - "scripts/check-technology-versions.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check platform versions
        run: python scripts/check-technology-versions.py
