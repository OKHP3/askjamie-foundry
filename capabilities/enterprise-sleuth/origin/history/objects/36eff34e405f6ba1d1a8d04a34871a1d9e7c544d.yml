name: Technology version audit

on:
  schedule:
    - cron: "17 8 * * 1"
  push:
    paths:
      - ".replit"
      - "ops/technology-inventory.md"
      - "scripts/check_technology_versions.py"
      - ".github/workflows/technology-version-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check tracked platform versions
        run: python scripts/check_technology_versions.py
