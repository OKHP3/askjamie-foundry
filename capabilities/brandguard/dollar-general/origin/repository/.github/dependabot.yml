version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # The repository currently has no application package manifest. Keep these
  # entries ready so Dependabot begins tracking immediately when those
  # ecosystems are introduced.
  - package-ecosystem: pip
    directory: "/.agents/skills/skill-creator"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
