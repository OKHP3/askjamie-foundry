name: Technology updates

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh upstream stable versions
        run: python ops/check_technology_updates.py

      - name: Open update pull request when needed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh technology versions"
          branch: automation/technology-updates
          delete-branch: true
          title: "chore: refresh technology versions"
          body: |
            Automated weekly refresh of the stable versions recorded in `ops/technology-versions.json`.

            Review upstream release notes and repository compatibility before merging.
          labels: dependencies,automation
