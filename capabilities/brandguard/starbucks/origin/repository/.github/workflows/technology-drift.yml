name: Technology drift check

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check pinned technology versions
        id: versions
        shell: pwsh
        run: ./ops/check-technology-updates.ps1

      - name: Open or update drift issue
        if: steps.versions.outputs.drift == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Technology drift: review Replit Nix channel';
            const body = `${process.env.DRIFT_MESSAGE}\n\nThis issue was generated by .github/workflows/technology-drift.yml. Update docs/technology-inventory.md after the owner-approved change.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const existing = issues.find(issue => issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
        env:
          DRIFT_MESSAGE: ${{ steps.versions.outputs.message }}
