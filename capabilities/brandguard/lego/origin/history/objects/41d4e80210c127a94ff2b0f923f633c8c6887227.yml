name: Technology version audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check versioned runtime pins
        id: audit
        continue-on-error: true
        run: |
          set -o pipefail
          python3 ops/check_technology_versions.py | tee technology-version-audit.txt

      - name: Open or update maintenance issue when drift is found
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Technology version drift detected"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Automated audit $(date -u +%Y-%m-%d):\n\n$(cat technology-version-audit.txt)"
          else
            gh issue create --title "$title" --body "The scheduled technology audit found version drift in the versioned runtime pins. Review compatibility, update .replit, and refresh docs/technology-inventory.md.\n\n$(cat technology-version-audit.txt)"
          fi

      - name: Fail the workflow when drift is found
        if: steps.audit.outcome == 'failure'
        run: exit 1
